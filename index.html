<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102d40"><title>¡Misión Español! Edward</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#173044;background:#f6f4ed}*{box-sizing:border-box}body{margin:0}header{background:#102d40;color:white;padding:26px 20px 22px;text-align:center}header small{letter-spacing:2px;color:#ffd58a}h1{font-size:31px;margin:8px 0}header p{margin:4px 0;color:#d9e5e8}main{max-width:620px;margin:auto;padding:20px 16px 60px}.panel{background:white;border-radius:20px;padding:23px;box-shadow:0 6px 25px #183a4a12;margin:12px 0}.btn{border:0;border-radius:13px;padding:15px 17px;font:inherit;font-weight:700;cursor:pointer;background:#ec694e;color:white;width:100%;margin:6px 0;text-align:left}.btn:active{transform:scale(.99)}.secondary{background:#e8f1ee;color:#174c4b}.answer{background:#f1f4f4;color:#163747;border:2px solid transparent;font-weight:600}.answer.correct{background:#e1f5e8;border-color:#39975b}.answer.wrong{background:#fde7e5;border-color:#d65349}.answer:disabled{opacity:1}.muted{color:#657681}.tag{display:inline-block;background:#ffe9c4;color:#805016;border-radius:30px;padding:6px 12px;font-size:13px;font-weight:700}.progress{height:9px;border-radius:20px;background:#e9e9e9;overflow:hidden;margin:15px 0}.progress div{height:100%;background:#ed7451;transition:width .25s}.question{font-size:23px;line-height:1.3;margin:20px 0}.feedback{border-radius:12px;padding:14px;background:#eef5f2;margin:15px 0;line-height:1.5}.score{font-size:54px;font-weight:800;text-align:center;color:#df6347}.small{font-size:14px}.hide{display:none}footer{text-align:center;color:#75818b;font-size:12px;padding:14px}ul{padding-left:22px;line-height:1.8}</style></head><body><header><small>EDWARDS SPANSKAUTMANING</small><h1>¡Misión Español!</h1><p>¡Qué bien! 7 · Unidad 1 A, B och C</p><p>Inför provet 22 oktober 2026</p></header><main id="app"></main><footer>Öva lite varje dag. ¡Tú puedes!</footer><script>
const bank=[
['a','Vad betyder ”¡Hola!”?',['Hej','Hej då','Tack','God natt'],0,'Hola är ett vanligt sätt att hälsa.'],
['a','Hur säger man ”God dag / god morgon”?',['Buenas tardes','Buenos días','Hasta luego','Adiós'],1,'Buenos días används på morgonen och förmiddagen.'],
['a','Vad betyder ”Hasta luego”?',['Vi ses','God natt','Varsågod','Förlåt'],0,'Hasta luego betyder vi ses.'],
['a','Hur frågar du ”Vad heter du?”',['¿Qué tal?','¿Cómo te llamas?','¿Dónde vives?','¿Hablas español?'],1,'¿Cómo te llamas? frågar efter någons namn.'],
['a','Vad svarar du på ”¿Cómo te llamas?”',['Tengo trece años.','Vivo en Madrid.','Me llamo Edward.','Estoy bien.'],2,'Me llamo betyder jag heter.'],
['a','Hur frågar du ”Var bor du?”',['¿Dónde vives?','¿De dónde eres?','¿Qué tal?','¿Cuántos años tienes?'],0,'Dónde vives betyder var bor du.'],
['a','Hur säger man ”jag”?',['tú','él','yo','nosotros'],2,'Yo = jag.'],
['a','Hur säger man ”vi”?',['vosotros','nosotros','ellos','ella'],1,'Nosotros = vi.'],
['a','Vad är rätt för ”jag pratar”?',['habla','hablo','hablas','hablan'],1,'Hablar är ett regelbundet ar-verb. Yo hablo.'],
['a','Vad är rätt för ”vi pratar”?',['hablamos','hablan','habláis','hablas'],0,'Nosotros hablamos.'],
['a','Vad betyder ”escuchar”?',['Att sjunga','Att studera','Att lyssna','Att dricka'],2,'Escuchar betyder att lyssna.'],
['a','Vad betyder ”tocar” i kapitlets verbövning?',['Att springa','Att spela instrument','Att köpa','Att bo'],1,'Tocar kan betyda att spela ett instrument.'],
['b','Vad betyder ”¿De dónde eres?”',['Var bor du?','Varifrån kommer du?','Hur mår du?','Vad kostar det?'],1,'De dónde eres frågar om ursprung.'],
['b','Hur säger man ”Jag är från Sverige”?',['Estoy Suecia.','Tengo de Suecia.','Soy de Suecia.','Es Suecia.'],2,'Ser används för ursprung: soy de Suecia.'],
['b','Hur säger man ”Jag är 13 år”?',['Soy trece años.','Tengo trece años.','Estoy trece años.','Tienes trece años.'],1,'Ålder uttrycks med tener: tengo trece años.'],
['b','Vad betyder ”¿Tienes hermanos?”',['Har du syskon?','Har du hund?','Är du hemma?','Har du pengar?'],0,'Tienes = du har, hermanos = syskon/bröder beroende på sammanhang.'],
['b','Vad betyder ”once”?',['1','11','12','20'],1,'Once = 11.'],
['b','Vad betyder ”dieciséis”?',['6','15','16','17'],2,'Dieciséis = 16.'],
['b','Vad betyder ”veinte”?',['12','15','19','20'],3,'Veinte = 20.'],
['b','Vad betyder ”la plaza”?',['Torget','Stranden','Affären','Skolan'],0,'La plaza = torget.'],
['b','Vad betyder ”la biblioteca”?',['Restaurangen','Biblioteket','Banken','Teatern'],1,'Biblioteca = bibliotek.'],
['b','Vilken mening betyder ”Jag mår bra, tack”?',['Soy bien, gracias.','Estoy bien, gracias.','Tengo bien, gracias.','Es bien, gracias.'],1,'Estar används för hur man mår.'],
['b','Hur säger man ”Madrid ligger i Spanien”?',['Madrid tiene España.','Madrid es de España.','Madrid está en España.','Madrid soy España.'],2,'Estar används här för geografiskt läge.'],
['c','Hur frågar du ”Hur mycket kostar det?”',['¿Cuánto cuesta?','¿Dónde vives?','¿Cómo estás?','¿Qué tal?'],0,'¿Cuánto cuesta? används när man frågar om pris.'],
['c','Vad betyder ”Una botella de agua, por favor”?',['Ett glas mjölk','En flaska vatten, tack','En kopp kaffe','En bit tårta'],1,'Botella = flaska, agua = vatten.'],
['c','Vad betyder ”allí”?',['Här','Nu','Där','Aldrig'],2,'Allí betyder där.'],
['c','Vilken artikel passar: ___ cafetería? (en)',['un','el','una','la'],2,'Cafetería är feminint: una cafetería.'],
['c','Vilken artikel passar: ___ restaurante? (en)',['un','una','la','el'],0,'Restaurante är maskulint: un restaurante.'],
['c','Vilken artikel passar: ___ plaza? (torget)',['el','un','una','la'],3,'Bestämd feminin artikel är la.'],
['c','Vilken artikel passar: ___ cine? (bion)',['la','una','el','un'],2,'Cine är maskulint: el cine.'],
['c','Vad betyder ”Hay peras en el mercado”?',['Det finns päron på marknaden','Jag köper päron','Marknaden är stängd','Päronen kostar mycket'],0,'Hay betyder det finns.'],
['c','Vad betyder ”¿Hablas español?”',['Är du spanjor?','Pratar du spanska?','Bor du i Spanien?','Studerar du?'],1,'Hablas = du pratar.'],
['c','Vad betyder ”mi abuela”?',['Min syster','Min kusin','Min mormor/farmor','Min mamma'],2,'Abuela = mormor eller farmor.'],
['c','Hur säger man ”han”?',['ella','él','ellos','usted'],1,'Él med accent betyder han.'],
['c','Hur säger man ”ni” (flera personer, vardagligt i Spanien)?',['vosotros','nosotros','usted','yo'],0,'Vosotros = ni i Spanien.']
];
let mode='',questions=[],index=0,answers=[],locked=false;
const app=document.getElementById('app');
function home(){app.innerHTML=`<section class="panel"><span class="tag">Välj uppdrag</span><h2>Fyra nivåer. Ett mål.</h2><p class="muted">Svara på frågorna och se vad du behöver öva mer på. Varje nivå har 10 frågor. Slutprovet har 20.</p><button class="btn" onclick="start('a')">1A · Hälsningar, frågor och ar-verb →</button><button class="btn" onclick="start('b')">1B · Stad, siffror och viktiga verb →</button><button class="btn" onclick="start('c')">1C · Café, artiklar och glosor →</button><button class="btn secondary" onclick="start('final')">Slutprovet · Blandade frågor →</button><h3>Glosträning</h3><p class="muted">Glosorna från skolans läxor. Välj ett område eller ett blandat glosprov.</p><button class="btn" onclick="vocabHome()">Öppna glosverkstaden →</button><button class="btn secondary" onclick="start('missed')" ${!localStorage.getItem('missedSpanish')?'disabled':''}>Repetera tidigare fel →</button></section><section class="panel small"><strong>Tips inför provet</strong><ul><li>Säg svaret högt innan du trycker.</li><li>Träna extra på ser, estar, tener och ar-verb.</li><li>Skriv också några meningar för hand.</li></ul></section>`}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(m){mode=m;let pool=m==='final'?bank:m==='missed'?bank.filter((_,i)=>JSON.parse(localStorage.getItem('missedSpanish')||'[]').includes(i)):bank.filter(q=>q[0]===m);questions=shuffle(pool).slice(0,m==='final'?20:10).map(q=>({q,bankIndex:bank.indexOf(q)}));index=0;answers=[];show()}
function show(){locked=false;if(index>=questions.length){finish();return}let q=questions[index].q;app.innerHTML=`<section class="panel"><span class="tag">${mode==='final'?'SLUTPROV':mode==='missed'?'REPETITION':'KAPITEL 1'+mode.toUpperCase()}</span><p class="muted small">Fråga ${index+1} av ${questions.length}</p><div class="progress"><div style="width:${index/questions.length*100}%"></div></div><h2 class="question">${q[1]}</h2><div id="options">${q[2].map((v,i)=>`<button class="btn answer" onclick="choose(${i})" id="opt${i}">${'ABCD'[i]}. ${v}</button>`).join('')}</div><div id="feedback"></div></section>`}
function choose(choice){if(locked)return;locked=true;let q=questions[index].q,correct=choice===q[3];answers.push({correct,bankIndex:questions[index].bankIndex});q[2].forEach((_,i)=>{let b=document.getElementById('opt'+i);b.disabled=true;if(i===q[3])b.classList.add('correct');else if(i===choice)b.classList.add('wrong')});document.getElementById('feedback').innerHTML=`<div class="feedback"><strong>${correct?'¡Muy bien! Rätt svar.':'Nästan! Här är förklaringen.'}</strong><p>${q[4]}</p></div><button class="btn" onclick="next()">${index===questions.length-1?'Se resultatet':'Nästa fråga'} →</button>`}
function next(){index++;show()}
function finish(){let score=answers.filter(a=>a.correct).length;let missed=JSON.parse(localStorage.getItem('missedSpanish')||'[]');for(let a of answers){if(a.correct)missed=missed.filter(x=>x!==a.bankIndex);else if(!missed.includes(a.bankIndex))missed.push(a.bankIndex)}localStorage.setItem('missedSpanish',JSON.stringify(missed));app.innerHTML=`<section class="panel"><span class="tag">UPPDRAG KLART</span><div class="score">${score}/${questions.length}</div><h2 style="text-align:center">${score===questions.length?'¡Excelente!':score>=questions.length*.75?'¡Muy bien!':score>=questions.length*.5?'¡Bien!':'¡Sigue practicando!'}</h2><p style="text-align:center">${score===questions.length?'Alla rätt! Testa nästa nivå.':'Du kan förbättra resultatet genom att repetera de frågor du missade.'}</p><button class="btn" onclick="start('${mode}')">Spela nivån igen</button><button class="btn secondary" onclick="start('missed')" ${!missed.length?'disabled':''}>Träna på mina fel (${missed.length})</button><button class="btn secondary" onclick="home()">Tillbaka till alla nivåer</button></section>`}

const vocabSets = {"Staden · v38": [["la ciudad", "staden"], ["pero", "men"], ["los hermanos", "syskon"], ["aquí", "här"], ["que", "som"], ["allí", "där"], ["estoy", "jag mår"], ["¿Dónde está?", "Var är/ligger/befinner sig?"], ["el mercado", "marknaden"], ["vale", "okej"]], "Familjen": [["la madre", "mamma"], ["el padre", "pappa"], ["el hermano", "bror"], ["la hermana", "syster"], ["el abuelo", "morfar/farfar"], ["la abuela", "mormor/farmor"], ["el tío", "morbror/farbror"], ["la tía", "moster/faster"], ["el primo", "kusin (kille)"], ["la prima", "kusin (tjej)"], ["el hermano mayor", "storebror"], ["la hermana menor", "lillasyster"], ["los padres", "föräldrar"], ["los hermanos", "syskon"]], "Uttryck · v40": [["para", "för att"], ["jugar", "spela/leka"], ["jugar online", "spela online"], ["camarero", "kypare"], ["leche", "mjölk"], ["un momento", "ett ögonblick"], ["soy", "jag är"], ["jugamos", "vi spelar"], ["¿De dónde eres?", "Varifrån är du?"], ["un poco", "lite"], ["también", "också"], ["estoy listo/lista", "jag är klar"], ["¡A jugar!", "Nu spelar vi!"]], "Språk · v41": [["un poco", "lite"], ["sueco", "svenska"], ["inglés", "engelska"], ["soy de", "jag kommer ifrån"], ["Estocolmo", "Stockholm"], ["la capital", "huvudstaden"], ["lenguas", "språk"], ["francés", "franska"], ["estudio", "jag studerar"], ["claro que sí", "självklart"], ["español", "spanska"]], "Mat · v42": [["el huevo", "ägg"], ["el queso", "ost"], ["el arroz", "ris"], ["la patata", "potatis"], ["el jamón", "skinka"], ["el aceite de oliva", "olivolja"], ["el pescado", "fisk"], ["el marisco", "skaldjur"], ["la naranja", "apelsin"], ["el pollo", "kyckling"], ["el pimiento", "paprika"], ["la gamba", "räka"]], "Bonus · Latinamerika": [["México", "Mexiko"], ["Guatemala", "Guatemala"], ["El Salvador", "El Salvador"], ["Honduras", "Honduras"], ["Nicaragua", "Nicaragua"], ["Costa Rica", "Costa Rica"], ["Panamá", "Panama"], ["Colombia", "Colombia"], ["Ecuador", "Ecuador"], ["Venezuela", "Venezuela"]]};
const vocabEntries = Object.entries(vocabSets).flatMap(([group,words])=>words.map(([es,sv],n)=>({id:group+'-'+n,group,es,sv})));
let vPool=[],vIndex=0,vCorrect=0,vMiss=[],vDirection='mix',vMode='practice',vAnswered=false;
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function vocabHome(){const groups=Object.keys(vocabSets);app.innerHTML=`<section class="panel"><span class="tag">GLOSVERKSTADEN</span><h2>Träna på skolans glosor</h2><p class="muted">60 glosor och uttryck från v38–42 inklusive familjen. De tio länderna från v37 är en bonusnivå.</p><p>Välj övning:</p>${groups.map((g,i)=>`<button class="btn secondary" onclick="vStart(${i},'practice')">${esc(g)} · ${vocabSets[g].length} ord →</button>`).join('')}<button class="btn" onclick="vStart(-1,'test')">Glosprov · 10 slumpade frågor →</button><button class="btn secondary" onclick="vStart(-2,'practice')">Repetera glosor jag missat →</button><button class="btn secondary" onclick="home()">← Till huvudmenyn</button></section>`;}
function vStart(g,kind){vMode=kind;let all=vocabEntries.filter(x=>!x.group.startsWith('Bonus'));if(g>=0){let name=Object.keys(vocabSets)[g];all=vocabEntries.filter(x=>x.group===name)}if(g===-2){let ids=JSON.parse(localStorage.getItem('spanishVocabMissed')||'[]');all=vocabEntries.filter(x=>ids.includes(x.id));if(!all.length){app.innerHTML='<section class="panel"><h2>Inga sparade fel ännu</h2><button class="btn" onclick="vocabHome()">Tillbaka</button></section>';return}}vPool=shuffle(all).slice(0,kind==='test'?10:all.length).map(x=>({...x,reverse:Math.random()<.5}));vIndex=0;vCorrect=0;vMiss=[];vShow();}
function vShow(){if(vIndex>=vPool.length){vFinish();return}vAnswered=false;let x=vPool[vIndex],front=x.reverse?x.sv:x.es,correct=x.reverse?x.es:x.sv;let options=shuffle([correct,...shuffle(vocabEntries.filter(y=>y.id!==x.id && (x.reverse?y.es:y.sv)!==correct).map(y=>x.reverse?y.es:y.sv)).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3)]);app.innerHTML=`<section class="panel"><span class="tag">${vMode==='test'?'GLOSPROV':'GLOSTRÄNING'}</span><p class="muted">Fråga ${vIndex+1} av ${vPool.length} · ${esc(x.group)}</p><h2>${esc(front)}</h2><p>Vad betyder det ${x.reverse?'på spanska':'på svenska'}?</p>${options.map((o,i)=>`<button class="btn secondary" id="vopt${i}" onclick="vChoose(${i})">${esc(o)}</button>`).join('')}<div id="vfeedback"></div><button class="btn secondary" onclick="vocabHome()">Avsluta</button></section>`;window.vOptions=options;}
function vChoose(i){if(vAnswered)return;vAnswered=true;let x=vPool[vIndex],correct=x.reverse?x.es:x.sv,good=window.vOptions[i]===correct;if(good)vCorrect++;else vMiss.push(x.id);window.vOptions.forEach((o,j)=>{let b=document.getElementById('vopt'+j);b.disabled=true;if(o===correct)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});document.getElementById('vfeedback').innerHTML=`<div class="feedback"><strong>${good?'Rätt!':'Inte riktigt.'}</strong><p>${esc(x.es)} = ${esc(x.sv)}</p></div><button class="btn" onclick="vIndex++;vShow()">${vIndex===vPool.length-1?'Visa resultat':'Nästa fråga'} →</button>`;}
function vFinish(){let old=JSON.parse(localStorage.getItem('spanishVocabMissed')||'[]');let seen=vPool.map(x=>x.id);old=old.filter(id=>!seen.includes(id));old=[...new Set([...old,...vMiss])];localStorage.setItem('spanishVocabMissed',JSON.stringify(old));app.innerHTML=`<section class="panel"><span class="tag">RESULTAT</span><div class="score">${vCorrect}/${vPool.length}</div><h2>${vCorrect===vPool.length?'¡Excelente!':'Bra jobbat!'}</h2><p>${vMiss.length?'Du missade '+vMiss.length+' ord i den här omgången. Repetera dem tills de sitter.':'Alla rätt i den här omgången!'}</p><button class="btn" onclick="vStart(-2,'practice')" ${!old.length?'disabled':''}>Repetera mina fel (${old.length})</button><button class="btn secondary" onclick="vocabHome()">Till glosverkstaden</button><button class="btn secondary" onclick="home()">Till huvudmenyn</button></section>`;}

home();
</script></body></html>
